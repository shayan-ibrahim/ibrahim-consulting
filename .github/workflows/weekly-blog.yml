name: Publish Weekly Blog Post

on:
  schedule:
    # Every Monday at 14:00 UTC = 9:00am CDT (UTC-5) / 10:00am CST (UTC-6)
    - cron: '0 14 * * 1'
  workflow_dispatch:   # Allow manual trigger for testing

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish this week's blog post
        run: python3 blog-data/publish.py

      - name: Commit and push if changed
        run: |
          git config user.name "Ibrahim Consulting Bot"
          git config user.email "shayan.ibrahim@gmail.com"
          if git diff --quiet; then
            echo "No changes — post may have already been published or schedule is outside range."
          else
            WEEK=$(python3 -c "
from datetime import date
start = date(2026, 9, 14)
today = date.today()
week = (today - start).days // 7 + 1
print(week)
")
            git add index.html
            git commit -m "chore: publish blog post $WEEK [automated]"
            git push
          fi
