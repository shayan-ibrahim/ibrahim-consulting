name: Publish Weekly Blog Post

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish this week's blog post
        run: python3 blog-data/publish.py

      - name: Commit and push if changed
        run: |
          git config user.name "Ibrahim Consulting Bot"
          git config user.email "shayan.ibrahim@gmail.com"
          if git diff --quiet; then
            echo "No changes - outside publish window."
          else
            git add index.html
            git commit -m "chore: publish weekly blog post [automated]"
            git push
          fi
